        suite:
          type: string
          minLength: 1
          maxLength: 100
        variants:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - keyword_only
              - dense_only
              - hybrid
              - simple_rag
              - agentic
              - reviewer_enabled
        max_cases:
          type: integer
          minimum: 1
          maximum: 50
          default: 10

    EvaluationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - suite
        - variants
        - status
        - case_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        suite:
          type: string
        variants:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        case_count:
          type: integer
          minimum: 0
          maximum: 50
        metrics:
          type: object
          additionalProperties:
            type: number
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    EvaluationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationRun"
        next_cursor:
          type: [string, "null"]

    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]
