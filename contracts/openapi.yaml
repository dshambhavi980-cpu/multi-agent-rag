openapi: 3.1.0
info:
  title: Multi-Agent Hybrid RAG API
  version: 0.1.0
  description: |
    Initial Phase 0 HTTP contract. All `/v1` operations require a verified
    Supabase JWT and an active workspace unless explicitly marked public.
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://{apiHost}
    description: Hosted API
    variables:
      apiHost:
        default: example.onrender.com
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Documents
  - name: Retrieval
  - name: Conversations
  - name: Runs
  - name: Approvals
  - name: Memory
  - name: Evaluations

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Process liveness
      security: []
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Dependency readiness
      security: []
      responses:
        "200":
          description: API can accept normal traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Deployed application version
      security: []
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Verify the Supabase access token and return its user identity
      responses:
        "200":
          description: Verified authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}/access:
    get:
      tags: [Authentication]
      operationId: getWorkspaceAccess
      summary: Resolve the caller's RLS-protected workspace role
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workspace membership and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/documents/upload-url:
    post:
      tags: [Documents]
      operationId: createDocumentUploadUrl
      summary: Create a short-lived direct Storage upload URL
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadUrlRequest"
      responses:
        "201":
          description: Signed upload was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/documents/complete-upload:
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      summary: Validate an uploaded object and enqueue ingestion
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "202":
          description: Document was accepted for ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List documents visible in the active workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
      responses:
        "200":
          description: Paginated document collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get one document and its ingestion state
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/documents/{documentId}/source:
    get:
      tags: [Documents]
      operationId: openDocumentSource
      summary: Open a short-lived signed document URL at an optional PDF page
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "307":
          description: Redirect to a short-lived signed storage URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Tombstone a document and enqueue data removal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Deletion was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/ingestion-jobs/{jobId}:
    get:
      tags: [Documents]
      operationId: getIngestionJob
      summary: Get durable ingestion status
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Ingestion job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/documents/{documentId}/reindex:
    post:
      tags: [Documents]
      operationId: reindexDocument
      summary: Enqueue a controlled re-index using the current index version
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexRequest"
      responses:
        "202":
          description: Re-indexing was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/retrieval/search:
    post:
      tags: [Retrieval]
      operationId: hybridSearch
      summary: Search indexed workspace documents using dense and keyword fusion
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalRequest"
      responses:
        "200":
          description: Deterministically ranked workspace-scoped chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List the current user's conversations
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation and recent messages
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/conversations/{conversationId}/messages:
    post:
      tags: [Conversations, Runs]
      operationId: createMessageRun
      summary: Create a user message and start a RAG or agent run
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "202":
          description: Run was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List recent workspace runs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Recent run summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get the durable run snapshot
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/runs/{runId}/trace:
    get:
      tags: [Runs]
      operationId: getRunTrace
      summary: Get a concise run timeline without internal reasoning
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Agent steps and tool outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTrace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/runs/{runId}/events:
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Stream live answer and run events
      description: |
        Authenticated SSE stream. Clients may send `Last-Event-ID` when
        reconnecting. Durable state is always available from the run endpoint.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events using the schemas in events.asyncapi.yaml
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/runs/{runId}/resume:
    post:
      tags: [Runs]
      operationId: resumeRun
      summary: Resume an incomplete agentic run from its durable checkpoint
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Checkpoint resume was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/runs/{runId}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation of a non-terminal run
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/runs/{runId}/replay:
    post:
      tags: [Runs]
      operationId: replayRun
      summary: Create a new run from a stored input and configuration snapshot
      description: Sensitive authorization is never inherited by the new run.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRunRequest"
      responses:
        "202":
          description: Replay run was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List approval requests visible to the reviewer
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: Paginated approval requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/workspace/usage:
    get:
      tags: [Workspaces]
      operationId: getWorkspaceUsage
      summary: Get current workspace record and document usage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace usage counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/approvals/{approvalId}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get one approval request
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/approvals/{approvalId}/approve:
    post:
      tags: [Approvals]
      operationId: approveRun
      summary: Approve a paused run, optionally with edited output
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Approval was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/approvals/{approvalId}/reject:
    post:
      tags: [Approvals]
      operationId: rejectRun
      summary: Reject a paused run
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Rejection was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/approvals/{approvalId}/revise:
    post:
      tags: [Approvals]
      operationId: requestRunRevision
      summary: Return a paused run to the workflow with reviewer feedback
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "200":
          description: Revision request was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/memories:
    get:
      tags: [Memory]
      operationId: listMemories
      summary: List attributable memories visible to the current actor
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: visibility
          in: query
          schema:
            $ref: "#/components/schemas/MemoryVisibility"
      responses:
        "200":
          description: Paginated memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/memories/{memoryId}:
    delete:
      tags: [Memory]
      operationId: deleteMemory
      summary: Delete a memory and remove it from future retrieval
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Memory was deleted and is no longer retrievable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/evaluations:
    get:
      tags: [Evaluations]
      operationId: listEvaluationRuns
      summary: List evaluation runs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated evaluation runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Evaluations]
      operationId: createEvaluationRun
      summary: Start a bounded evaluation run
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationRequest"
      responses:
        "202":
          description: Evaluation run was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/evaluations/{evaluationId}:
    get:
      tags: [Evaluations]
      operationId: getEvaluationRun
      summary: Get one evaluation run and aggregate metrics
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/EvaluationId"
      responses:
        "200":
          description: Evaluation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceId:
      name: X-Workspace-ID
      in: header
      required: true
      description: Active workspace. Membership is verified server-side.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request validation or business-rule failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid, or expired authentication
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated actor lacks permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is not visible to this actor
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: State or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Application or provider quota is exhausted
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retry, when known
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: Required provider is temporarily unavailable
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, time]
      properties:
        status:
          const: ok
        time:
          type: string
          format: date-time
        cold_start:
          type: boolean
          default: false

    Readiness:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, degraded, unavailable]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ready, degraded, unavailable]

    Version:
      type: object
      additionalProperties: false
      required: [version, commit, environment]
      properties:
        version:
          type: string
        commit:
          type: string
        environment:
          type: string

    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
          format: email
        role:
          const: authenticated

    WorkspaceAccess:
      type: object
      additionalProperties: false
      required: [workspace_id, user_id, role]
      properties:
        workspace_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, reviewer, member]

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
          default: false
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    CreateUploadUrlRequest:
      type: object
      additionalProperties: false
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum:
            - application/pdf
            - text/plain
            - text/markdown
            - text/html
        size_bytes:
          type: integer
          minimum: 1
          maximum: 26214400
        sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"

    CreateUploadUrlResponse:
      type: object
      additionalProperties: false
      required: [upload_id, object_path, signed_url, upload_token, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
        object_path:
          type: string
        signed_url:
          type: string
          format: uri
        upload_token:
          type: string
        expires_at:
          type: string
          format: date-time

    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [upload_id, object_path, sha256]
      properties:
        upload_id:
          type: string
          format: uuid
        object_path:
          type: string
        sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        title:
          type: [string, "null"]
          maxLength: 255
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50

    IngestionAccepted:
      type: object
      additionalProperties: false
      required: [document, job, deduplicated]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        job:
          anyOf:
            - $ref: "#/components/schemas/IngestionJob"
            - type: "null"
        deduplicated:
          type: boolean

    DocumentStatus:
      type: string
      enum:
        - uploaded
        - queued
        - processing
        - ready
        - failed
        - quarantined

    Document:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - filename
        - content_type
        - size_bytes
        - sha256
        - status
        - index_version
        - target_index_version
        - uploaded_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        filename:
          type: string
        title:
          type: [string, "null"]
        content_type:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        index_version:
          type: integer
          minimum: 0
        target_index_version:
          type: integer
          minimum: 1
        chunk_strategy:
          anyOf:
            - $ref: "#/components/schemas/ChunkStrategy"
            - type: "null"
        embedding_model:
          type: [string, "null"]
        embedding_dimensions:
          type: [integer, "null"]
        indexed_at:
          type: [string, "null"]
          format: date-time
        uploaded_by:
          type: string
          format: uuid
        page_count:
          type: [integer, "null"]
        chunk_count:
          type: integer
          default: 0
        tags:
          type: array
          items:
            type: string
        failure_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        next_cursor:
          type: [string, "null"]

    ChunkStrategy:
      type: string
      enum: [fixed, recursive, heading_recursive]

    ReindexRequest:
      type: object
      additionalProperties: false
      properties:
        strategy:
          anyOf:
            - $ref: "#/components/schemas/ChunkStrategy"
            - type: "null"

    RetrievalMode:
      type: string
      enum: [hybrid, dense, sparse]

    RetrievalFilters:
      type: object
      additionalProperties: false
      properties:
        document_ids:
          type: [array, "null"]
          maxItems: 20
          items:
            type: string
            format: uuid
        created_after:
          type: [string, "null"]
          format: date-time
        created_before:
          type: [string, "null"]
          format: date-time
        content_types:
          type: [array, "null"]
          maxItems: 4
          items:
            type: string
            enum: [application/pdf, text/plain, text/markdown, text/html]
        tags:
          type: [array, "null"]
          maxItems: 20
          items:
            type: string
            maxLength: 50

    RetrievalRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        mode:
          $ref: "#/components/schemas/RetrievalMode"
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 6
        candidate_count:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        filters:
          $ref: "#/components/schemas/RetrievalFilters"

    RetrievalResult:
      type: object
      additionalProperties: false
      required:
        - chunk_id
        - document_id
        - chunk_index
        - content
        - page_start
        - page_end
        - filename
        - content_type
        - tags
        - document_created_at
        - rrf_score
        - final_rank
      properties:
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        content:
          type: string
        page_start:
          type: integer
        page_end:
          type: integer
        section_heading:
          type: [string, "null"]
        char_start:
          type: [integer, "null"]
        char_end:
          type: [integer, "null"]
        token_count:
          type: [integer, "null"]
        filename:
          type: string
        title:
          type: [string, "null"]
        content_type:
          type: string
        tags:
          type: array
          items:
            type: string
        document_created_at:
          type: string
          format: date-time
        semantic_rank:
          type: [integer, "null"]
        sparse_rank:
          type: [integer, "null"]
        semantic_score:
          type: [number, "null"]
        sparse_score:
          type: [number, "null"]
        rrf_score:
          type: number
        final_rank:
          type: integer

    RetrievalResponse:
      type: object
      additionalProperties: false
      required:
        - trace_id
        - cache_hit
        - embedding_cache_hit
        - index_fingerprint
        - dense_candidate_count
        - sparse_candidate_count
        - embedding_ms
        - database_ms
        - total_ms
        - items
      properties:
        trace_id:
          type: string
          format: uuid
        cache_hit:
          type: boolean
        embedding_cache_hit:
          type: boolean
        index_fingerprint:
          type: string
          pattern: "^[a-f0-9]{32}$"
        dense_candidate_count:
          type: integer
          minimum: 0
        sparse_candidate_count:
          type: integer
          minimum: 0
        embedding_ms:
          type: number
          minimum: 0
        database_ms:
          type: number
          minimum: 0
        total_ms:
          type: number
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalResult"

    IngestionJobStatus:
      type: string
      enum: [queued, processing, completed, failed, quarantined, cancelled]

    IngestionJob:
      type: object
      additionalProperties: false
      required: [id, document_id, status, progress, attempt, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/IngestionJobStatus"
        stage:
          type: [string, "null"]
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempt:
          type: integer
          minimum: 0
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200

    Conversation:
      type: object
      required:
        [id, workspace_id, owner_id, summary_message_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        summary_through_message_id:
          type: [string, "null"]
          format: uuid
        summary_message_count:
          type: integer
          minimum: 0
          default: 0
        summary_updated_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          type: [string, "null"]

    MessageRole:
      type: string
      enum: [user, assistant, system]

    Message:
      type: object
      additionalProperties: false
      required: [id, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        answer_status:
          type: [string, "null"]
          enum: [grounded, insufficient_evidence, failed, null]
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        created_at:
          type: string
          format: date-time

    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 12000
        document_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        force_mode:
          type: string
          enum: [auto, simple, agentic]
          default: auto

    RunMode:
      type: string
      enum: [simple, agentic]

    RunStatus:
      type: string
      enum:
        - accepted
        - running
        - awaiting_approval
        - cancelling
        - cancelled
        - completed
        - failed
        - timed_out

    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, message_id, status, events_url]
      properties:
        run_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        events_url:
          type: string
          format: uri-reference

    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - status
        - mode
        - step_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        mode:
          $ref: "#/components/schemas/RunMode"
        current_node:
          type: [string, "null"]
        step_count:
          type: integer
          minimum: 0
          maximum: 8
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        answer_status:
          type: [string, "null"]
          enum: [grounded, insufficient_evidence, failed, null]
        output_message_id:
          type: [string, "null"]
          format: uuid
        approval_id:
          type: [string, "null"]
          format: uuid
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    RunSummary:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [question]
          properties:
            question:
              type: string

    AgentStep:
      type: object
      additionalProperties: false
      required: [id, step_number, node, status, summary, duration_ms, created_at]
      properties:
        id:
          type: string
          format: uuid
        step_number:
          type: integer
          minimum: 1
          maximum: 8
        node:
          type: string
        status:
          type: string
          enum: [succeeded, failed, skipped]
        summary:
          type: string
        duration_ms:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time

    ToolCall:
      type: object
      additionalProperties: false
      required: [id, tool_name, permission, status, output_summary, duration_ms, created_at]
      properties:
        id:
          type: string
          format: uuid
        tool_name:
          type: string
        permission:
          type: string
        status:
          type: string
          enum: [succeeded, failed]
        output_summary:
          type: object
          additionalProperties: true
        duration_ms:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time

    RunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next_cursor:
          type: [string, "null"]

    RunTrace:
      type: object
      additionalProperties: false
      required: [run, steps, tool_calls]
      properties:
        run:
          $ref: "#/components/schemas/RunSummary"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentStep"
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    WorkspaceUsage:
      type: object
      additionalProperties: false
      required:
        [documents, document_bytes, ready_documents, conversations, runs, approvals, memories]
      properties:
        documents:
          type: integer
          minimum: 0
        document_bytes:
          type: integer
          minimum: 0
        ready_documents:
          type: integer
          minimum: 0
        conversations:
          type: integer
          minimum: 0
        runs:
          type: integer
          minimum: 0
        approvals:
          type: integer
          minimum: 0
        memories:
          type: integer
          minimum: 0

    ReplayRunRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [exact_snapshot, current_configuration]
        reason:
          type: string
          minLength: 1
          maxLength: 500

    Citation:
      type: object
      additionalProperties: false
      required: [citation_id, document_id, chunk_id, label, quote]
      properties:
        citation_id:
          type: string
          pattern: "^C[1-9][0-9]*$"
        document_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
        label:
          type: string
        page:
          type: [integer, "null"]
          minimum: 1
        section:
          type: [string, "null"]
        quote:
          type: string
          maxLength: 1000
        source_url:
          type: string
          format: uri-reference

    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, revision_requested, expired]

    Approval:
      type: object
      additionalProperties: false
      required:
        - id
        - run_id
        - status
        - risk_level
        - reasons
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        reasons:
          type: array
          minItems: 1
          items:
            type: string
        proposed_output:
          type: [string, "null"]
        reviewer_id:
          type: [string, "null"]
          format: uuid
        reviewer_comment:
          type: [string, "null"]
        decided_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        next_cursor:
          type: [string, "null"]

    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 2000
        edited_output:
          type: [string, "null"]
          maxLength: 30000

    RevisionRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 2000

    MemoryVisibility:
      type: string
      enum: [private, workspace]

    Memory:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - owner_id
        - visibility
        - content
        - confidence
        - source_type
        - source_excerpt
        - can_delete
        - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/MemoryVisibility"
        content:
          type: string
        confidence:
          type: number
          minimum: 0.9
          maximum: 1
        source_type:
          type: string
          enum: [explicit_user, approved]
        source_excerpt:
          type: string
          maxLength: 500
        conversation_id:
          type: [string, "null"]
          format: uuid
        source_message_id:
          type: [string, "null"]
          format: uuid
        can_delete:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemoryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        next_cursor:
          type: [string, "null"]

    MemoryDeleted:
      type: object
      additionalProperties: false
      required: [id, deleted]
      properties:
        id:
          type: string
          format: uuid
        deleted:
          type: boolean

    CreateEvaluationRequest:
      type: object
      additionalProperties: false
      required: [suite, variants]
