name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.2
      - run: python scripts/check_contracts.py
      - run: python scripts/check_migrations.py
      - run: python scripts/check_evaluation_regression.py
      - run: python scripts/check_release_config.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "./apps/api[dev]"
      - run: python -m ruff check .
        working-directory: apps/api
      - run: python -m ruff format --check .
        working-directory: apps/api
      - run: python -m mypy app tests
        working-directory: apps/api
      - run: python -m pytest
        working-directory: apps/api

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: python -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install --upgrade pip==26.1.2
      - run: .audit-venv/bin/python -m pip install -e "./apps/api" pip-audit==2.9.0
      - run: .audit-venv/bin/python -m pip_audit --local --skip-editable
      - run: npm audit --omit=dev --audit-level=high
      - run: .audit-venv/bin/python scripts/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase-13-sbom
          path: artifacts/sbom.cdx.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -e "./apps/api[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
