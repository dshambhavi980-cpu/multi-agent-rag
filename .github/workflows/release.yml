name: Production Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release identifier, for example v0.14.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -e "./apps/api[dev]"
      - run: npm ci
      - run: python scripts/check_contracts.py
      - run: python scripts/check_migrations.py
      - run: python scripts/check_evaluation_regression.py
      - run: python scripts/check_release_config.py
      - run: python -m pytest
        working-directory: apps/api
      - run: npm run check:web

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Link reviewed production project
        run: npx supabase@2.110.0 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply reviewed migrations
        run: npx supabase@2.110.0 db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-backend:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render release
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  smoke:
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - name: Wait for and verify public release
        run: python scripts/release_smoke.py --timeout 600
        env:
          DOC_PILOT_API_URL: ${{ vars.VITE_API_BASE_URL }}
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
          APP_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}

  deploy-frontend:
    needs: smoke
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel production release
        run: curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      - name: Verify public frontend
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-all-errors --retry-delay 10
          "${{ vars.PRODUCTION_FRONTEND_URL }}" > /dev/null

  record:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - run: >-
          python scripts/release_snapshot.py
          --api-url "${{ vars.VITE_API_BASE_URL }}"
          --frontend-url "${{ vars.PRODUCTION_FRONTEND_URL }}"
          --release "${{ inputs.release }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.release }}
          path: artifacts/releases/${{ inputs.release }}.json
